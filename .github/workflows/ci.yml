name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --max-line-length=120 --statistics --exit-zero

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not network"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: router-security-tool:ci

      - name: Smoke-test the image
        run: |
          docker run -d --name rst -p 8000:8000 router-security-tool:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"' || { docker logs rst; exit 1; }
          # The SPA must be served, not just the API.
          curl -fsS http://localhost:8000/ | grep -qi '<div id="root"' || { docker logs rst; exit 1; }
          curl -fsS http://localhost:8000/history | grep -qi '<div id="root"' || { docker logs rst; exit 1; }
